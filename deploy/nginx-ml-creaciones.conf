# Nginx recibe las visitas (HTTP/HTTPS) y se las pasa al backend en 127.0.0.1:3000.
# Certbot agrega el bloque HTTPS y la redirección automáticamente.
server {
    listen 80;
    listen [::]:80;
    server_name srv2071565.hstgr.cloud;

    # Fotos de productos de hasta 5 MB (con margen).
    client_max_body_size 6m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
